[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dom-bike-tool"
version = "1.0.0"
description = "DOM Engineering — Outil de conception vélo custom"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.108",
]

[project.scripts]
dom-bike = "backend.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
